version: '3.8'

services:
  ocr-pipeline:
    build: .
    container_name: ocr_banking_app
    ports:
      - "8501:8501"
    volumes:
      # Đồng bộ thư mục dữ liệu test và kết quả ra ngoài máy thật
      - ./DataTest_AI_OCR:/app/DataTest_AI_OCR
      - ./outputs:/app/outputs
    restart: unless-stopped
